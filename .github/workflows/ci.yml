name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 같은 테스트를 H2 인메모리 DB 와 PostgreSQL 16(Testcontainers, 러너의 Docker 사용) 양쪽에서 실행한다.
      # DB 는 테스트가 직접 띄우므로 접속 정보(Neon 등)가 필요 없다.
      - name: Run tests
        run: ./gradlew test --no-daemon

      # Docker 가 없으면 *PostgresTest 는 조용히 건너뛰어지므로, CI 에서는 실제로 실행됐는지 확인한다.
      - name: Ensure PostgreSQL tests ran
        run: |
          ls build/test-results/test/TEST-*PostgresTest.xml
          if grep -l "<skipped" build/test-results/test/TEST-*PostgresTest.xml; then
            echo "::error::PostgreSQL(Testcontainers) 테스트가 건너뛰어졌습니다. Docker 를 확인하세요."
            exit 1
          fi

      - name: Test summary
        if: always()
        run: python3 .github/scripts/junit_summary.py build/test-results/test >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: build/reports/tests/test
          retention-days: 14

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
