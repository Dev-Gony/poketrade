spring:
  application:
    name: pocket-market
  profiles:
    active: local
  # DB 접속 정보 등 비밀 값은 Git 에 올리지 않는 .env.properties 에서 읽는다 (예시: .env.properties.example).
  config:
    import: optional:file:.env.properties

  # 기본 DB: Neon PostgreSQL. 접속 정보는 DB_URL / DB_USERNAME / DB_PASSWORD (환경변수 또는 .env.properties)
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon 은 유휴 시 컴퓨트가 일시 중지되므로 첫 연결이 느릴 수 있다.
      connection-timeout: 30000
      maximum-pool-size: 5

  jpa:
    hibernate:
      # 영속 DB 이므로 재시작해도 데이터를 지우지 않도록 update. (운영은 마이그레이션 도구 + validate 권장)
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  order:
    payment-due-hours: 24
  payment:
    webhook-secret: local-webhook-secret
    # 가상계좌 발급 PG: fake(기본, 키 불필요) | toss(토스페이먼츠 테스트 모드. README 참고)
    provider: ${PAYMENT_PROVIDER:fake}
    toss:
      base-url: https://api.tosspayments.com
      # 테스트 시크릿 키(test_sk_...)만 허용. 라이브 키는 기동 시 거부한다. 환경변수 또는 .env.properties 에만 둔다.
      secret-key: ${TOSS_SECRET_KEY:}
  scheduling:
    enabled: true
  cors:
    # 브라우저(Next.js)에서 매물·주문 API 를 직접 호출할 수 있는 출처 패턴 (콤마 구분)
    allowed-origin-patterns: http://localhost:[*],http://127.0.0.1:[*]

---
# 오프라인 개발용 인메모리 H2: --spring.profiles.active=local,h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # LOCK_TIMEOUT: 비관적 락 대기 최대 시간(ms)
    url: jdbc:h2:mem:pocket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create

---
# MySQL 운영/개발 환경 예시: --spring.profiles.active=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/pocket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  payment:
    webhook-secret: ${WEBHOOK_SECRET}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
