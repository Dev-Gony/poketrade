spring:
  datasource:
    url: jdbc:h2:mem:pocket-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # create: 시작할 때 지우고 다시 만든다. create-drop 은 종료 시점에 이미 내려간 Testcontainers DB 에
      # DROP 을 시도하느라 30초를 기다리므로 쓰지 않는다. (H2·PostgreSQL 테스트 공통)
      ddl-auto: create
    open-in-view: false

app:
  order:
    payment-due-hours: 24
  payment:
    webhook-secret: test-webhook-secret
  scheduling:
    enabled: false
